# Parameters for the calibration session (calibration.launch.py).
# Camera topics, mount, output_file and poses_file are set per camera by the launch file.

target_detector:
  ros__parameters:
    # Must match the printed board. MEASURE the printed squares with calipers;
    # a 1% scale error here becomes a 1% scale error in the camera position.
    squares_x: 7
    squares_y: 5
    square_length: 0.035    # m  (default board fits A4 / US Letter)
    marker_length: 0.026    # m
    dictionary: DICT_5X5_100
    min_corners: 6
    max_reprojection_error_px: 2.0
    publish_tf: true
    board_frame: calib_board

handeye_calibration:
  ros__parameters:
    robot_base_frame: base_link
    robot_effector_frame: tool0
    board_pose_topic: /target_detector/board_pose
    method: park                    # tsai | park | horaud | andreff | daniilidis
    max_board_pose_age_s: 0.5
    max_motion_m: 0.002
    max_motion_deg: 0.3

handeye_motion:
  ros__parameters:
    trajectory_action: /scaled_joint_trajectory_controller/follow_joint_trajectory
    take_sample_service: /handeye_calibration/take_sample
    max_joint_speed: 0.3            # rad/s
    min_move_duration_s: 3.0
    settle_s: 1.5
